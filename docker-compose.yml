services:
  ksc:
    build: .
    container_name: ksc-auto-catch
    # Do not restart a completed/stopped registration worker and replay Add.
    restart: "no"
    environment:
      KSC_DATA_DIR: /app/logs
      KSC_LOG_DIR: /app/logs
    volumes:
      - ./session.json:/app/session.json:ro
      - ./logs:/app/logs

    command:
      - --sections
      - 12345,67890                 # Replace with your Section IDs.
      - --interval
      - "15"                        # polling interval in seconds
      - --load-session
      - session.json

      # Optional drop alongside an add. Check both sections after a swap.
      # - --drop-section
      # - 26667

      # Optional waitlist fallback for a confirmed closed section.
      # - --waitlist

      # Optional JSON webhook after all targets are confirmed.
      # - --webhook
      # - https://example.com/ksc-webhook
